[project]
name = "clonalg"
version = "0.1.0"
description = "CLONALG: CLONal selection ALGorithm for continuous function optimization"
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "plotly>=6.6.0",
    "seaborn>=0.13.2",
    "streamlit>=1.56.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "COM812"]  # pycodestyle errors, pyflakes, isort, trailing commas
